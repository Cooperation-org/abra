[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abra-lib"
version = "0.1.0"
description = "A brain extension library for naming things"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
# Install with: pip install abra-lib[embeddings]
embeddings = ["sentence-transformers>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]
