<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>abra · bindings</title>
  <link rel="stylesheet" href="__BASE__/style.css">
  <script src="https://unpkg.com/htmx.org@1.9.12" integrity="sha384-ujb1lZYygJmzgSwoxRggbCHcjc0rB2XoQrxeTUQyRjrOnlCoYta87iKBWq3EsdM2" crossorigin="anonymous"></script>
</head>
<body>
  <nav class="topnav">
    <a href="__BASE__/"><span class="ed" data-k="tab.categories">__T_tab.categories__</span></a>
    <a href="__BASE__/bindings/" class="active"><span class="ed" data-k="tab.bindings">__T_tab.bindings__</span></a>
    <span class="spacer"></span>
    <button type="button" class="toggle"
            onclick="document.body.classList.toggle('show-codes')"><span class="ed" data-k="tab.showcodes">__T_tab.showcodes__</span></button>
    <button type="button" class="toggle edit-toggle"
            onclick="document.body.classList.toggle('editing')"><span class="ed" data-k="tab.edit">__T_tab.edit__</span></button>
  </nav>

  <div class="page">
    <header>
      <h1><span class="ed" data-k="bind.h1">__T_bind.h1__</span></h1>
      <p class="lead"><span class="ed" data-k="bind.lead">__T_bind.lead__</span></p>
    </header>

    <main>
      <div id="flash" aria-live="polite"></div>

      __CHIP__

      <form class="search-row"
            hx-get="__BASE__/bindings/list"
            hx-trigger="keyup changed delay:200ms from:input[name=q], load"
            hx-target="#binding-list"
            hx-swap="innerHTML">
        <input type="search" name="q" placeholder="__T_bind.search.placeholder__" autofocus autocomplete="off" value="__Q__">
        <input type="hidden" name="catcode" value="__CATCODE__">
        <input type="hidden" name="label" value="__LABEL__">
      </form>

      <div class="col-toggles">
        <button type="button" class="ct" data-col="rel"><span class="ed" data-k="bind.col.rel">__T_bind.col.rel__</span></button>
        <button type="button" class="ct" data-col="qual"><span class="ed" data-k="bind.col.qual">__T_bind.col.qual__</span></button>
        <button type="button" class="ct" data-col="tgt"><span class="ed" data-k="bind.col.tgt">__T_bind.col.tgt__</span></button>
        <button type="button" class="ct" data-col="date"><span class="ed" data-k="bind.col.date">__T_bind.col.date__</span></button>
        <button type="button" class="ct" data-col="from"><span class="ed" data-k="bind.col.from">__T_bind.col.from__</span></button>
      </div>

      <div id="binding-list">
        <p class="muted">Loading…</p>
      </div>
    </main>
    <script>
      // Column hide/show — flips body classes that CSS listens for.
      // Per-page session only; persistence waits for the data-models
      // session's per-user config (see scratch.md). Not using localStorage:
      // abra is the store, not the browser.
      document.querySelectorAll('.col-toggles .ct').forEach(function (b) {
        b.addEventListener('click', function () {
          var cls = 'hide-' + b.dataset.col;
          document.body.classList.toggle(cls);
          b.classList.toggle('hidden', document.body.classList.contains(cls));
        });
      });
    </script>

    <footer>
      <p class="muted">
        <a href="https://github.com/Cooperation-org/abra">abra</a> ·
        view subsystem
      </p>
    </footer>
  </div>
  <script src="__BASE__/edit.js"></script>
</body>
</html>
