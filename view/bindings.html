<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>abra · bindings</title>
  <link rel="stylesheet" href="__BASE__/style.css">
  <script src="https://unpkg.com/htmx.org@1.9.12" integrity="sha384-ujb1lZYygJmzgSwoxRggbCHcjc0rB2XoQrxeTUQyRjrOnlCoYta87iKBWq3EsdM2" crossorigin="anonymous"></script>
</head>
<body>
  <nav class="topnav">
    <a href="__BASE__/">categories</a>
    <a href="__BASE__/bindings/" class="active">people &amp; notes</a>
    <span class="spacer"></span>
    <button type="button" class="toggle"
            onclick="document.body.classList.toggle('show-codes')">show codes</button>
  </nav>

  <div class="page">
    <header>
      <h1>what you know</h1>
      <p class="lead">Type to find a name. Click a row to open it.</p>
    </header>

    <main>
      <div id="flash" aria-live="polite"></div>

      __CHIP__

      <form class="search-row"
            hx-get="__BASE__/bindings/list"
            hx-trigger="keyup changed delay:200ms from:input[name=q], load"
            hx-target="#binding-list"
            hx-swap="innerHTML">
        <input type="search" name="q" placeholder="find a name…" autofocus autocomplete="off" value="__Q__">
        <input type="hidden" name="catcode" value="__CATCODE__">
        <input type="hidden" name="hot" value="__HOT__">
      </form>

      <div class="col-toggles">
        <button type="button" class="ct" data-col="rel">kind</button>
        <button type="button" class="ct" data-col="qual">what</button>
        <button type="button" class="ct" data-col="tgt">where</button>
        <button type="button" class="ct" data-col="date">when</button>
        <button type="button" class="ct" data-col="from">from</button>
      </div>

      <div id="binding-list">
        <p class="muted">Loading…</p>
      </div>
    </main>
    <script>
      // Column hide/show — flips body classes that CSS listens for.
      // Per-page session only; persistence waits for the data-models
      // session's per-user config (see scratch.md). Not using localStorage:
      // abra is the store, not the browser.
      document.querySelectorAll('.col-toggles .ct').forEach(function (b) {
        b.addEventListener('click', function () {
          var cls = 'hide-' + b.dataset.col;
          document.body.classList.toggle(cls);
          b.classList.toggle('hidden', document.body.classList.contains(cls));
        });
      });
    </script>

    <footer>
      <p class="muted">
        <a href="https://github.com/Cooperation-org/abra">abra</a> ·
        view subsystem
      </p>
    </footer>
  </div>
</body>
</html>
