<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>abra · bindings</title>
  <link rel="stylesheet" href="__BASE__/style.css">
  <script src="https://unpkg.com/htmx.org@1.9.12" integrity="sha384-ujb1lZYygJmzgSwoxRggbCHcjc0rB2XoQrxeTUQyRjrOnlCoYta87iKBWq3EsdM2" crossorigin="anonymous"></script>
</head>
<body>
  <nav class="topnav">
    <a href="__BASE__/">categories</a>
    <a href="__BASE__/bindings/" class="active">people &amp; notes</a>
    <span class="spacer"></span>
    <button type="button" class="toggle"
            onclick="document.body.classList.toggle('show-codes')">show codes</button>
  </nav>

  <div class="page">
    <header>
      <h1>people &amp; notes</h1>
      <p class="lead">Sorted by how often something comes up. Type to filter. Click a row to see what you know about it.</p>
    </header>

    <main>
      <div id="flash" aria-live="polite"></div>

      <div class="search-row">
        <input type="search" name="q" placeholder="filter by name…" autofocus autocomplete="off"
               value="__Q__"
               hx-get="__BASE__/bindings/list"
               hx-trigger="keyup changed delay:200ms, load"
               hx-target="#binding-list"
               hx-swap="innerHTML">
      </div>

      <div id="binding-list">
        <p class="muted">Loading…</p>
      </div>
    </main>

    <footer>
      <p class="muted">
        <a href="https://github.com/Cooperation-org/abra">abra</a> ·
        view subsystem
      </p>
    </footer>
  </div>
</body>
</html>
