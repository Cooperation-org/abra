<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>abra · catcodes</title>
  <link rel="stylesheet" href="__BASE__/style.css">
  <script src="https://unpkg.com/htmx.org@1.9.12" integrity="sha384-ujb1lZYygJmzgSwoxRggbCHcjc0rB2XoQrxeTUQyRjrOnlCoYta87iKBWq3EsdM2" crossorigin="anonymous"></script>
</head>
<body>
  <nav class="topnav">
    <a href="__BASE__/" class="active"><span class="ed" data-k="tab.categories">__T_tab.categories__</span></a>
    <a href="__BASE__/bindings/"><span class="ed" data-k="tab.bindings">__T_tab.bindings__</span></a>
    <span class="spacer"></span>
    <button type="button" class="toggle"
            onclick="document.body.classList.toggle('show-codes')"><span class="ed" data-k="tab.showcodes">__T_tab.showcodes__</span></button>
    <button type="button" class="toggle edit-toggle"
            onclick="document.body.classList.toggle('editing')"><span class="ed" data-k="tab.edit">__T_tab.edit__</span></button>
  </nav>

  <div class="page">
    <header>
      <h1><span class="ed" data-k="cat.h1">__T_cat.h1__</span></h1>
      <p class="lead"><span class="ed" data-k="cat.lead">__T_cat.lead__</span></p>
    </header>

    <main>
      <div id="flash" aria-live="polite"></div>

      <div class="top-actions">
        <button type="button"
                hx-get="__BASE__/catcodes/new"
                hx-target="#new-slot"
                hx-swap="innerHTML"><span class="ed" data-k="cat.new">__T_cat.new__</span></button>
      </div>
      <div id="new-slot"></div>

      <div id="tree"
           hx-get="__BASE__/catcodes/tree"
           hx-trigger="load"
           hx-swap="innerHTML">
        <p class="muted">Loading…</p>
      </div>
    </main>

    <footer>
      <p class="muted">
        <a href="https://github.com/Cooperation-org/abra">abra</a> ·
        view subsystem
      </p>
    </footer>
  </div>
  <script src="__BASE__/edit.js"></script>
</body>
</html>
