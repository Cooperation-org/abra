<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>abra · catcodes</title>
  <link rel="stylesheet" href="__BASE__/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://unpkg.com/htmx.org@1.9.12" integrity="sha384-ujb1lZYygJmzgSwoxRggbCHcjc0rB2XoQrxeTUQyRjrOnlCoYta87iKBWq3EsdM2" crossorigin="anonymous"></script>
</head>
<body class="__BODY_CLASS__">
  <nav class="topnav">
    <a href="__BASE__/" class="nav active" aria-label="home"><i class="fa-solid fa-house"></i></a>
    <a href="#" class="nav" onclick="if(document.body.classList.contains('editing')){document.body.classList.remove('editing');return false}history.back();return false" aria-label="back"><i class="fa-solid fa-arrow-left"></i></a>
    <button type="button" class="nav add-component"
            onclick="alert('Components — coming. See scratch.md / data-models discussion.')"
            aria-label="add a component"><i class="fa-solid fa-puzzle-piece"></i></button>
    <span class="spacer"></span>
    <button type="button" class="nav" data-ui-pref="ui.show-codes" aria-label="show codes"><i class="fa-solid fa-hashtag"></i></button>
    <button type="button" class="nav edit-toggle"
            onclick="document.body.classList.toggle('editing')" aria-label="edit"><i class="fa-solid fa-pen"></i></button>
  </nav>

  <div class="page">
    <header>
      <h1><span class="ed" data-k="cat.h1">__T_cat.h1__</span></h1>
      <p class="lead"><span class="ed" data-k="cat.lead">__T_cat.lead__</span></p>
    </header>

    <main>
      <div id="flash" aria-live="polite"></div>

      <div class="top-actions">
        <button type="button" class="list-add"
                hx-get="__BASE__/catcodes/new"
                hx-target="#new-slot"
                hx-swap="innerHTML"
                aria-label="add top-level"><i class="fa-solid fa-plus"></i></button>
      </div>
      <div id="new-slot"></div>

      <div id="tree"
           hx-get="__BASE__/catcodes/tree"
           hx-trigger="load"
           hx-swap="innerHTML">
        <p class="muted">Loading…</p>
      </div>
    </main>

    <footer>
      <p class="muted">
        <a href="https://github.com/Cooperation-org/abra">abra</a> ·
        view subsystem
      </p>
    </footer>
  </div>
  <script src="__BASE__/edit.js"></script>
</body>
</html>
