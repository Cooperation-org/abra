<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>abra · recent</title>
  <link rel="stylesheet" href="__BASE__/style.css?v=__ASSET_VER__">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://unpkg.com/htmx.org@1.9.12" integrity="sha384-ujb1lZYygJmzgSwoxRggbCHcjc0rB2XoQrxeTUQyRjrOnlCoYta87iKBWq3EsdM2" crossorigin="anonymous"></script>
</head>
<body class="__BODY_CLASS__">
  <nav class="topnav">
    <a href="__BASE__/" class="nav" aria-label="Categories" title="Categories"><i class="fa-solid fa-folder-tree"></i></a>
    <a href="__BASE__/bindings/" class="nav" aria-label="Bindings" title="Bindings"><i class="fa-solid fa-list"></i></a>
    <a href="__BASE__/recent/" class="nav active" aria-label="Recent" title="Recent"><i class="fa-solid fa-arrow-down-wide-short"></i></a>
    <a href="#" class="nav" onclick="history.back();return false" aria-label="back"><i class="fa-solid fa-arrow-left"></i></a>
    <button type="button" class="nav add-component write-only"
            hx-get="__BASE__/components/chooser"
            hx-target="#modal-slot"
            hx-swap="innerHTML"
            aria-label="add a component"><i class="fa-solid fa-puzzle-piece"></i></button>
    <span id="topnav-installed"
          hx-get="__BASE__/components/menu"
          hx-trigger="load"
          hx-swap="innerHTML"></span>
    <span class="spacer"></span>
    <button type="button" class="nav edit-toggle"
            onclick="document.body.classList.toggle('editing')" aria-label="edit"><i class="fa-solid fa-pen"></i></button>
  </nav>

  <div class="page">
    <header>
      <h1><span class="ed" data-k="recent.h1">__T_recent.h1__</span></h1>
      <p class="lead"><span class="ed" data-k="recent.lead">__T_recent.lead__</span></p>
    </header>

    <main>
      <div id="flash" aria-live="polite"></div>
      <div class="feed-controls">
        <button type="button" id="feed-toggle-all" class="feed-toggle expanded"
                onclick="(function(b){var open=b.classList.toggle('expanded');document.querySelectorAll('#recent-feed details').forEach(function(d){d.open=open});})(this)"
                aria-label="collapse or expand all"><i class="fa-solid fa-chevron-down"></i></button>
      </div>
      <div id="recent-feed">__FEED__</div>
    </main>

    <footer>
      <p class="muted">
        <a href="https://github.com/Cooperation-org/abra">abra</a> ·
        view subsystem
      </p>
    </footer>
  </div>
  <div id="modal-slot"></div>
  <script src="__BASE__/edit.js?v=__ASSET_VER__"></script>
</body>
</html>
